<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="../estilos/main.css">
</head>
<body>
    <header>
        <h1>Contáctanos</h1>        
    </header>
    <main>
        <p>Llena los campos con tus datos</p>
        <br>
        <br>    
    <form id="formulario" novalidate>
        <fieldset>
            <legend>Información personal y de contacto</legend>
        <br>
        <div class="campo">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required><br>
        </div>

        <div class="campo">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required><br>
        </div>

        <div class="campo">
        <label for="telefono">Número de teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required><br>
        </div>
        </fieldset>
        <br>
        <fieldset>
            <legend>Mensaje</legend>
        <br>
        <div class="campo">
        <label for="mensaje">¿En qué te podemos ayudar?</label>
        <label for="cantidad">Cantidad:</label>
        <textarea id="mensaje" rows="4" required></textarea><br>
        </div>
        <p id="mensaje" aria-live="polite"></p>
        <br>
        <button type="submit" id="btn-enviar">Enviar</button>
        </fieldset>
    </form>
    <br>
    <a href="../index.html">Volver al inicio</a>
</body>
</html>
